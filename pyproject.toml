[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-kef"
version = "0.8.41"
description = "HACS-ready KEF integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Community Maintainers" }]
dependencies = ["aiohttp>=3.9", "cryptography>=42.0.0"]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-homeassistant-custom-component>=0.13.346",
  "ruff>=0.11.0",
  "mypy==2.4.1"
]

[tool.setuptools.packages.find]
include = ["custom_components*", "kef_client*"]

[tool.setuptools.package-data]
"kef_client" = ["*.pyi", "py.typed"]
"custom_components.kef" = ["py.typed", "manifest.json", "icons.json", "services.yaml", "translations/*.json", "brand/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".codex_tmp", "old"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["custom_components/kef"]
